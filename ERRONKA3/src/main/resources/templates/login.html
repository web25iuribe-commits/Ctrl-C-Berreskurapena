<!DOCTYPE html>
<html lang="eu" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saioa hasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/Style.css" rel="stylesheet"/>
</head>
<body class="login-page min-vh-100 d-flex flex-column">

  <main class="flex-grow-1 d-flex align-items-center justify-content-center w-100">
  <div class="card login-card shadow-lg p-4" style="width: 100%; max-width: 420px;">
    <h3 class="login-title mb-1">Saioa hasi</h3>
    <p class="login-subtitle small mb-4">Sartu zure kontrol panelera</p>

    <div th:if="${error}" class="alert alert-danger py-2" role="alert" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
      
    <div class="mb-3">
      <label for="email" class="form-label login-label text-uppercase small fw-semibold">Helbide elektronikoa</label>
      <input type="email" class="form-control login-input" id="email" name="email" placeholder="email@adibidea.com" autocomplete="email" required/>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label login-label text-uppercase small fw-semibold">Pasahitza</label>
      <input type="password" class="form-control login-input" id="password" name="pasahitza" placeholder="pasahitza" autocomplete="current-password" required/>
    </div>

    <button type="submit" class="btn btn-primary w-100 fw-bold mb-2 btn-login">
      Sartu
    </button>

    <button type="button" class="btn btn-outline-primary w-100" onclick="handleDelete()">
      Datuak ezabatu
    </button>
    </form>
  </div>
  </main>

  <div class="position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 999">
    <div id="toast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body fw-semibold" id="toastMsg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function handleDelete() {
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      showToast('Datuak ezabatu dira', 'primary');
    }

    function showToast(msg, type) {
      const toastEl = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toastEl.className = `toast align-items-center text-bg-${type} border-0`;
      const t = bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 2800 });
      t.show();
    }
    </script>
  <footer class="app-footer">
    <p>&copy; 2026 Ctrl-C | All rights reserved, designed and developed by Ctrl-C team.</p>
  </footer>
</body>
</html>
